name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  # Permet de relancer le déploiement à la main depuis l'onglet Actions
  workflow_dispatch:

# Un seul déploiement à la fois ; les pushes suivants attendent leur tour
# plutôt que d'annuler un déploiement déjà en cours.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Construire le site
        run: npm run build

      - name: Vérifier que les pages attendues existent
        run: |
          set -e
          for page in \
            fr/index.html \
            en/index.html \
            fr/qui-sommes-nous/index.html \
            en/who-we-are/index.html \
            fr/actualites/index.html \
            en/news/index.html \
            fr/partenaires/index.html \
            en/partners/index.html
          do
            if [ ! -f "dist/$page" ]; then
              echo "::error::Page manquante dans la build : $page"
              exit 1
            fi
          done
          echo "Les 8 pages principales sont présentes."

      - name: Publier l'artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
